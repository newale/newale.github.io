{%- comment -%}
  Mancheta del sitio. También la incluye feed.xsl.liquid, así que tiene que
  ser XML válido: atributos con comillas y etiquetas cerradas.
{%- endcomment -%}
<header class="mancheta">
  <div class="mancheta-fila contenedor">
    <a class="mancheta-marca" href="/">AEBN</a>
    <nav class="mancheta-nav" aria-label="Secciones">
      {%- for item in navegacion %}
      <a href="{{ item.url }}"{% if navActiva == item.id %} aria-current="page"{% endif %}>{{ item.nombre }}</a>
      {%- endfor %}
    </nav>
  </div>
</header>
