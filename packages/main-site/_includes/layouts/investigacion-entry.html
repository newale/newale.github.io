<!DOCTYPE html>
<html lang="es-CL">
<head>
  {% include "head.html" %}
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/static/css/broadsheet.css">
  <link rel="stylesheet" href="/static/css/inicio.css">
</head>
<body>

  <nav style="position:sticky;top:0;z-index:5;background:var(--color-bg);">
    <div class="nav" style="max-width:760px;margin:0 auto;padding:var(--space-3) clamp(20px,5vw,72px);">
      <span class="nav-brand">AEBN</span>
      <a href="/">Inicio</a>
      <a href="/musica">Música</a>
      <a href="/investigacion" aria-current="page">Investigación</a>
      <a href="/aplicaciones">Aplicaciones</a>
    </div>
  </nav>

  <div style="max-width:760px;margin:0 auto;padding:calc(2*28px) clamp(20px,5vw,72px) calc(3.5*28px);">
    <p style="margin:0 0 var(--space-4);">
      <a href="/investigacion" style="font-size:13px;text-transform:uppercase;letter-spacing:0.08em;color:color-mix(in srgb, var(--color-text) 70%, transparent);text-decoration:none;">← Investigación</a>
    </p>
    <h1>{{ title }}</h1>
    <p style="font-size:13px;letter-spacing:0.02em;color:color-mix(in srgb, var(--color-text) 60%, transparent);margin:0 0 var(--space-6);">
      {{ date | formattedDate }}
      {% if tags %}{% for tag in tags %} · <a href="/tags/{{ tag | slugify }}/" class="tag tag-outline">{{ tag }}</a>{% endfor %}{% endif %}
    </p>
    <div class="investigacion-body">
      {{ content }}
    </div>
  </div>

  {% include "components/footer.html" %}

</body>
</html>
