<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="msin-bg" cx="35%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#2b1a55"/>
      <stop offset="55%" stop-color="#150c33"/>
      <stop offset="100%" stop-color="#08051a"/>
    </radialGradient>
    <radialGradient id="msin-blob-a" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bf57e9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#bf57e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="msin-blob-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57c7e9" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#57c7e9" stop-opacity="0"/>
    </radialGradient>
    <filter id="msin-noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="3" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="60"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#msin-bg)"/>

  <g filter="url(#msin-noise)">
    <circle cx="300" cy="330" r="240" fill="url(#msin-blob-a)"/>
    <circle cx="520" cy="480" r="220" fill="url(#msin-blob-b)"/>
    <circle cx="430" cy="260" r="150" fill="url(#msin-blob-a)" opacity="0.7"/>
  </g>

  <g stroke="#d8aaeb" stroke-opacity="0.18" fill="none">
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="640" x2="800" y2="640"/>
  </g>
</svg>
